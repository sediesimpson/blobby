<!DOCTYPE html>
<html>
<head>
  <title>blobby</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #fdf6ec;
      overflow: hidden;
    }
    #blobby {
      position: fixed;
      top: calc(50% - 70px);
      transform-origin: bottom center;
      animation: peek 2s ease-out 0.5s both;
    }
    @keyframes peek {
      0%   { left: -120px; transform: rotate(0deg); }
      60%  { left: -75px;  transform: rotate(23deg); }
      75%  { left: -75px;  transform: rotate(15deg); }
      100% { left: -75px;  transform: rotate(23deg); }
    }
  </style>
</head>
<body>

  <svg id="blobby" width="120" height="140" viewBox="0 0 120 140">
    <path
      d="M10 60
         C10 27 33 5 60 5
         C87 5 110 27 110 60
         L110 120
         Q93 150 77 120
         Q60 150 43 120
         Q27 150 10 120
         Z"
      fill="#bfe3f7"
    />

        <!-- Eyes -->
    <circle cx="45" cy="62" r="7" fill="#2b3a4a" />
    <circle cx="75" cy="62" r="7" fill="#2b3a4a" />

    <!-- Eye sparkles -->
    <circle cx="47" cy="59" r="2.5" fill="white" />
    <circle cx="77" cy="59" r="2.5" fill="white" />

    <!-- Rosy cheeks -->
    <ellipse cx="34" cy="74" rx="7" ry="4" fill="#f7b6c8" />
    <ellipse cx="86" cy="74" rx="7" ry="4" fill="#f7b6c8" />

    <!-- Smile -->
    <path d="M53 74 Q60 81 67 74"
          fill="none" stroke="#2b3a4a" stroke-width="3" stroke-linecap="round" />
  </svg>

</body>
</html>
